apiVersion: v1
kind: Namespace
metadata:
  name: clustercost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustercost-agent
  namespace: clustercost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustercost-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustercost-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustercost-agent
subjects:
  - kind: ServiceAccount
    name: clustercost-agent
    namespace: clustercost
---
apiVersion: v1
kind: Secret
metadata:
  name: clustercost-remote
  namespace: clustercost
stringData:
  token: "replace-me"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clustercost-agent
  namespace: clustercost
spec:
  selector:
    matchLabels:
      app: clustercost-agent
  template:
    metadata:
      labels:
        app: clustercost-agent
    spec:
      serviceAccountName: clustercost-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      containers:
        - name: agent
          image: ghcr.io/you/clustercost-agent-k8s:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_RESOURCE
                - SYS_ADMIN
                - BPF
                - PERFMON
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: "my-cluster"
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: debug
              mountPath: /sys/kernel/debug
              readOnly: false
            - name: queue
              mountPath: /var/lib/clustercost/queue
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /agent/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        - name: debug
          hostPath:
            path: /sys/kernel/debug
        - name: queue
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clustercost-agent
  namespace: clustercost
spec:
  selector:
    app: clustercost-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
